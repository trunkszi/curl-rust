[package]
name = "curl-sys"
version = "0.4.91+curl-8.22.0"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
links = "curl"
build = "build.rs"
license = "MIT"
repository = "https://github.com/alexcrichton/curl-rust"
description = "Native bindings to the libcurl library"
documentation = "https://docs.rs/curl-sys"
categories = ["external-ffi-bindings"]
edition = "2021"
exclude = ["curl/docs/", "curl/tests/"]

[lib]
name = "curl_sys"
path = "lib.rs"

[dependencies]
libz-sys = { workspace = true, default-features = false }
libc = { workspace = true, default-features = true }
libnghttp2-sys = { workspace = true, default-features = true, optional = true }

rustls-ffi = { workspace = true, default-features = true }

[target.'cfg(all(unix))'.dependencies]



[build-dependencies]
cc = { workspace = true, default-features = true }

[features]
default = []
http2 = ["libnghttp2-sys"]
