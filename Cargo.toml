[package]
name = "curl"
version = "0.6.0"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
license = "MIT"
repository = "https://github.com/alexcrichton/curl-rust"
homepage = "https://github.com/alexcrichton/curl-rust"
documentation = "https://docs.rs/curl"
description = "Rust bindings to libcurl for making HTTP requests"
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
autotests = true
edition = "2024"

[dependencies]
libc = { workspace = true, default-features = true }
curl-sys = { path = "curl-sys", version = "0.4.91", default-features = false }
socket2 = { workspace = true, default-features = true }

# Unix platforms use OpenSSL for now to provide SSL functionality
[target.'cfg(all(unix))'.dependencies]


[dev-dependencies]
anyhow = { workspace = true, default-features = true }

[workspace]
members = ["curl-sys", "systest"]

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = true }
cc = { version = "1.2.49", default-features = true }
libc = { version = "0.2", default-features = true }
libnghttp2-sys = { version = "0.1.13", default-features = true }
libz-sys = { version = "1.1.29", default-features = false, features = ["libc"] }
socket2 = { version = "0.6.5", default-features = true }
rustls-ffi = { version = "0.15.3", default-features = true, features = ["no_log_capture"] }
ctest2 = { version = "0.4.10", default-features = true }

[features]
default = []
http2 = ["curl-sys/http2"]

[[test]]
name = "atexit"
harness = false

[[example]]
name = "https"
path = "examples/https.rs"

[[example]]
name = "ssl_proxy"
path = "examples/ssl_proxy.rs"

[[example]]
name = "ssl_cert_blob"
path = "examples/ssl_cert_blob.rs"

[[example]]
name = "ssl_client_auth"
path = "examples/ssl_client_auth.rs"
required-features = []

[[example]]
name = "multi-dl"
path = "examples/multi-dl.rs"

[[test]]
name = "single_thread"
harness = false
