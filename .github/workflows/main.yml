name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [x86_64, x86_64-musl, x86_64-beta, x86_64-nightly, macos]
        include:
          - build: x86_64
            os: ubuntu-latest
            rust: stable
            docker: linux64
            target: x86_64-unknown-linux-gnu
          - build: x86_64-beta
            os: ubuntu-latest
            rust: beta
            docker: linux64
            target: x86_64-unknown-linux-gnu
          - build: x86_64-nightly
            os: ubuntu-latest
            rust: nightly
            docker: linux64
            target: x86_64-unknown-linux-gnu
          - build: x86_64-musl
            os: ubuntu-latest
            rust: stable
            docker: musl
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-15-intel
            rust: stable
            target: x86_64-apple-darwin
    steps:
    - uses: actions/checkout@v1
      with:
        submodules: true
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }}
      shell: bash
    - run: rustup target add ${{ matrix.target }}
    - run: TARGET=${{ matrix.target }} ./ci/run.sh
      if: matrix.os != 'ubuntu-latest'
      name: Run non-docker tests
      shell: bash
    - run: |
        set -e
        cargo generate-lockfile
        mkdir .cargo target
        docker build -t rust -f ci/Dockerfile-${{ matrix.docker }} ci
        docker run \
          -w /src \
          -v `pwd`:/src:ro \
          -v `pwd`/target:/src/target \
          -v `pwd`/ci/.cargo:/src/.cargo:ro \
          -v `rustc --print sysroot`:/usr/local:ro \
          -e TARGET=${{ matrix.target }} \
          -e NO_RUN=${{ matrix.no_run }} \
          -e CARGO_TARGET_DIR=/src/target \
          rust \
          sh ci/run.sh
      if: matrix.os == 'ubuntu-latest'
      name: Run docker tests

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
      with:
        submodules: true
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - run: cargo fmt -- --check

  publish_docs:
    name: Publish Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
        with:
          submodules: true
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libkrb5-dev
      - name: Build documentation
        run: cargo doc --no-deps --all-features
      - name: Publish documentation
        run: |
          cd target/doc
          git init
          git add .
          git -c user.name='ci' -c user.email='ci' commit -m init
          git push -f -q https://git:${{ secrets.github_token }}@github.com/${{ github.repository }} HEAD:gh-pages
        if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
